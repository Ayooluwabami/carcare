openapi: 3.0.0
info:
  title: CarCare API
  description: API documentation for the CarCare application
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local server

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    username:
                      type: string
                    email:
                      type: string
    post:
      summary: Add a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User added successfully
        '400':
          description: Validation error

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
        '404':
          description: User not found

    put:
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: User updated successfully
        '404':
          description: User not found
        '400':
          description: Validation error

    delete:
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found

  /mechanics:
    get:
      summary: Get all mechanics
      responses:
        '200':
          description: A list of mechanics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    specialization:
                      type: string
    post:
      summary: Add a new mechanic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                specialization:
                  type: string
      responses:
        '201':
          description: Mechanic added successfully
        '400':
          description: Validation error

  /mechanics/{id}:
    get:
      summary: Get a mechanic by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Mechanic ID
          schema:
            type: string
      responses:
        '200':
          description: Mechanic found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  specialization:
                    type: string
        '404':
          description: Mechanic not found

    put:
      summary: Update a mechanic
      parameters:
        - name: id
          in: path
          required: true
          description: Mechanic ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                specialization:
                  type: string
      responses:
        '200':
          description: Mechanic updated successfully
        '404':
          description: Mechanic not found
        '400':
          description: Validation error

    delete:
      summary: Delete a mechanic
      parameters:
        - name: id
          in: path
          required: true
          description: Mechanic ID
          schema:
            type: string
      responses:
        '204':
          description: Mechanic deleted successfully
        '404':
          description: Mechanic not found

  /services:
    get:
      summary: Get all services
      responses:
        '200':
          description: A list of services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
    post:
      summary: Add a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Service added successfully
        '400':
          description: Validation error

  /services/{id}:
    get:
      summary: Get a service by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      responses:
        '200':
          description: Service found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
        '404':
          description: Service not found

    put:
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Service updated successfully
        '404':
          description: Service not found
        '400':
          description: Validation error

    delete:
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          description: Service ID
          schema:
            type: string
      responses:
        '204':
          description: Service deleted successfully
        '404':
          description: Service not found
